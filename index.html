<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レトロドット・アニメーションプレイヤー</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background: #0b0b0b;
            color: #fff;
        }
        .box {
            background: #161616;
            padding: 25px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #333;
            max-width: 700px;
            width: 100%;
            box-sizing: border-box;
        }
        input, button, select {
            margin: 8px 0;
            padding: 10px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #0984e3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }
        button:hover { background: #74b9ff; }
        button.success { background: #00b894; }
        button.success:hover { background: #55efc4; }
        button.accent { background: #e17055; }
        button.accent:hover { background: #fab1a0; }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }

        .control-group {
            text-align: left;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
        label { font-size: 14px; color: #bbb; display: block; margin-bottom: 5px; }

        /* キャンバスとフルスクリーン対応のコンテナ */
        #playerContainer {
            position: relative;
            background: #000;
            border: 4px solid #333;
            border-radius: 4px;
            margin-top: 15px;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
        }
        #playerContainer:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #renderCanvas {
            display: block;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }
        #playerContainer:fullscreen #renderCanvas {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #status {
            margin-top: 10px;
            color: #fdcb6e;
            font-size: 14px;
            font-family: monospace;
            word-break: break-all;
            min-height: 2em;
        }

        /* タイムライン・コントロール */
        .timeline-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        #timeSlider {
            flex-grow: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>DOT ANIMATION PLAYER</h1>
        <p>テキストデータ再生プレイヤー</p>

        <div class="control-group">
            <label>1. テキストデータ (.txt):</label>
            <input type="file" id="txtFile" accept=".txt">

            <label>2. 同時に抽出した音声 (.mp4 / .webm など ※任意):</label>
            <input type="file" id="audioFile" accept="audio/*">

            <label>3. 横解像度 (抽出時と同じ値を設定):</label>
            <select id="widthSelect">
                <option value="160">160 px</option>
                <option value="320">320 px</option>
                <option value="640" selected>640 px (HD)</option>
                <option value="1280">1280 px (WQHD)</option>
                <option value="1920">1920 px (フルHD)</option>
            </select>

            <label>4. 再生FPS (抽出時と同じ値に設定):</label>
            <select id="fpsSelect">
                <option value="5">5 fps</option>
                <option value="10" selected>10 fps</option>
                <option value="15">15 fps</option>
                <option value="30">30 fps</option>
            </select>
        </div>

        <div style="margin-top: 15px;">
            <button id="playBtn" onclick="togglePlay()" class="success" disabled>▶ 再生 / 一時停止</button>
            <button id="fsBtn" onclick="toggleFullScreen()" class="accent" disabled>🖥 フルスクリーンで再生</button>
        </div>

        <div class="timeline-box">
            <span id="timeDisplay" style="font-family: monospace; font-size: 12px;">00:00 / 00:00</span>
            <input type="range" id="timeSlider" min="0" max="100" value="0" step="0.1" disabled>
        </div>

        <div id="status">テキストファイルを選択してください</div>

        <!-- 描画エリア（フルスクリーン対象） -->
        <div id="playerContainer">
            <canvas id="renderCanvas" width="640" height="360"></canvas>
        </div>

        <!-- 音声再生用の隠しaudio要素 -->
        <audio id="bgmAudio" preload="auto"></audio>
    </div>

    <script>
        const txtFileInput   = document.getElementById('txtFile');
        const audioFileInput = document.getElementById('audioFile');
        const widthSelect    = document.getElementById('widthSelect');
        const fpsSelect      = document.getElementById('fpsSelect');
        const playBtn        = document.getElementById('playBtn');
        const fsBtn          = document.getElementById('fsBtn');
        const statusDiv      = document.getElementById('status');
        const canvas         = document.getElementById('renderCanvas');
        const ctx            = canvas.getContext('2d');
        const playerContainer= document.getElementById('playerContainer');
        const bgmAudio       = document.getElementById('bgmAudio');
        const timeSlider     = document.getElementById('timeSlider');
        const timeDisplay    = document.getElementById('timeDisplay');

        let frames = [];          // 各フレームのテキストを保持する配列
        let currentFrameIndex = 0;
        let isPlaying = false;
        let animationTimer = null;
        let frameWidth = 640;
        let frameHeight = 360;
        let fps = 10;
        let isUserSeeking = false;

        // --- ファイル読み込み処理 ---
        txtFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = 'テキストデータを読み込んで解析中...';
            playBtn.disabled = true;
            fsBtn.disabled = true;

            try {
                const text = await file.text();
                // 改行区切りでフレームに分割（空行は除外）
                frames = text.split(/\r?\n/).filter(line => line.length > 0);
                
                if (frames.length === 0) {
                    throw new Error('有効なデータが見つかりませんでした。');
                }

                frameWidth = parseInt(widthSelect.value);
                // アスペクト比 16:9 から高さを自動計算
                frameHeight = Math.round(frameWidth * 0.5625);
                canvas.width = frameWidth;
                canvas.height = frameHeight;

                currentFrameIndex = 0;
                timeSlider.max = frames.length - 1;
                timeSlider.value = 0;
                updateTimeDisplay();

                // 最初のフレームを描画
                drawFrame(0);

                statusDiv.innerText = `読み込み完了！ (総フレーム数: ${frames.length})。「再生」を押してください。`;
                playBtn.disabled = false;
                fsBtn.disabled = false;
                timeSlider.disabled = false;
            } catch (err) {
                statusDiv.innerText = 'エラー: ' + err.message;
            }
        });

        // 音声ファイルのセットアップ
        audioFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const audioUrl = URL.createObjectURL(file);
            bgmAudio.src = audioUrl;
            statusDiv.innerText += ' (音声セット完了)';
        });

        // 解像度やFPSが変更されたときの再計算
        widthSelect.addEventListener('change', () => {
            frameWidth = parseInt(widthSelect.value);
            frameHeight = Math.round(frameWidth * 0.5625);
            canvas.width = frameWidth;
            canvas.height = frameHeight;
            if (frames.length > 0) drawFrame(currentFrameIndex);
        });

        fpsSelect.addEventListener('change', () => {
            fps = parseFloat(fpsSelect.value);
            if (isPlaying) {
                stopAnimation();
                startAnimation();
            }
        });

        // --- フレーム描画ロジック ---
        function drawFrame(index) {
            if (!frames[index]) return;
            const line = frames[index];

            // 1フレーム分の文字データをキャンバス（ピクセル）に展開
            const imgData = ctx.createImageData(frameWidth, frameHeight);
            const data = imgData.data;

            for (let i = 0, p = 0; i < line.length && i < frameWidth * frameHeight; i++, p += 4) {
                const charCode = line.charCodeAt(i);
                // '0' (48) 〜 '9' (57) の数字を 0〜255 の輝度に変換
                let val = 0;
                if (charCode >= 48 && charCode <= 57) {
                    val = Math.floor(((charCode - 48) / 9) * 255);
                }
                data[p]     = val; // R
                data[p + 1] = val; // G
                data[p + 2] = val; // B
                data[p + 3] = 255; // A (不透明)
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // --- 再生制御 ---
        function togglePlay() {
            if (frames.length === 0) return;
            if (isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        function startAnimation() {
            fps = parseFloat(fpsSelect.value);
            const interval = 1000 / fps;

            isPlaying = true;
            playBtn.innerText = '⏸ 一時停止';

            // 音声がある場合は一緒に再生
            if (bgmAudio.src && bgmAudio.src !== window.location.href) {
                // 現在のフレーム位置から音声の再生位置を合わせる
                bgmAudio.currentTime = currentFrameIndex / fps;
                bgmAudio.play().catch(e => console.log('音声再生ブロック:', e));
            }

            let lastTime = performance.now();

            function loop(now) {
                if (!isPlaying) return;
                const elapsed = now - lastTime;

                if (elapsed >= interval) {
                    lastTime = now - (elapsed % interval);
                    
                    if (currentFrameIndex >= frames.length) {
                        // ループ再生（末尾到達時）
                        currentFrameIndex = 0;
                        if (bgmAudio.src && bgmAudio.src !== window.location.href) {
                            bgmAudio.currentTime = 0;
                        }
                    }

                    drawFrame(currentFrameIndex);
                    timeSlider.value = currentFrameIndex;
                    updateTimeDisplay();
                    currentFrameIndex++;
                }
                animationTimer = requestAnimationFrame(loop);
            }
            animationTimer = requestAnimationFrame(loop);
        }

        function stopAnimation() {
            isPlaying = false;
            playBtn.innerText = '▶ 再生 / 一時停止';
            if (animationTimer) {
                cancelAnimationFrame(animationTimer);
                animationTimer = null;
            }
            if (bgmAudio.src && bgmAudio.src !== window.location.href) {
                bgmAudio.pause();
            }
        }

        // --- タイムライン操作 ---
        timeSlider.addEventListener('input', (e) => {
            isUserSeeking = true;
            currentFrameIndex = parseInt(e.target.value);
            drawFrame(currentFrameIndex);
            updateTimeDisplay();
            
            if (bgmAudio.src && bgmAudio.src !== window.location.href) {
                bgmAudio.currentTime = currentFrameIndex / parseFloat(fpsSelect.value);
            }
        });

        timeSlider.addEventListener('change', () => {
            isUserSeeking = false;
        });

        function updateTimeDisplay() {
            const currentFps = parseFloat(fpsSelect.value);
            const curSec = currentFrameIndex / currentFps;
            const totalSec = frames.length / currentFps;
            timeDisplay.innerText = `${formatTime(curSec)} / ${formatTime(totalSec)}`;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // --- フルスクリーン対応 ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => {
                    alert('フルスクリーンに失敗しました: ' + err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
