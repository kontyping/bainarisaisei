<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レトロドット・プレイヤー ＆ MP4コンバーター</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background: #0b0b0b; color: #fff; }
        .box { background: #161616; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 20px rgba(0,0,0,0.8); border: 1px solid #333; max-width: 550px; width: 100%; box-sizing: border-box; }
        input, button, select { margin: 10px 0; padding: 10px; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { background: #0984e3; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; }
        button:hover { background: #74b9ff; }
        button.accent { background: #00b894; }
        button.accent:hover { background: #55efc4; }
        
        #playerCanvas { 
            background: #000; 
            border: 6px solid #222; 
            border-radius: 4px;
            margin-top: 15px; 
            width: 320px; 
            height: 240px; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            object-fit: contain;
        }
        #playerCanvas:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
            background: #000;
        }
        
        #status { margin-top: 10px; color: #fdcb6e; font-size: 14px; font-family: monospace; word-break: break-all; }
        .control-group { text-align: left; background: #222; padding: 15px; border-radius: 8px; margin-top: 10px; }
        label { font-size: 14px; color: #bbb; display: block; margin-bottom: 5px; }
        audio { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>RETRO DOT PLAYER</h1>
        <p>ドットテキスト ＆ MP3音声で再生・MP4書き出し</p>
        
        <div class="control-group">
            <label>1. ドットテキストファイル (.txt):</label>
            <input type="file" id="textFile" accept=".txt">
            
            <label>2. 音声ファイル (.mp3):</label>
            <input type="file" id="audioFile" accept="audio/*">

            <label>3. 再生フレームレート (FPS):</label>
            <select id="fpsSelect">
                <option value="1">1 fps</option>
                <option value="5">5 fps</option>
                <option value="10" selected>10 fps</option>
                <option value="15">15 fps</option>
                <option value="30">30 fps</option>
                <option value="60">60 fps</option>
            </select>
        </div>

        <button onclick="playRetro()" class="accent">▶ 再生する</button>
        <button onclick="toggleFullScreen()">⤢ フルスクリーンで見る</button>
        <button onclick="exportToMP4()">💾 MP4動画として書き出し・ダウンロード</button>
        
        <div id="status">ファイルをすべて選択してください</div>
        
        <div>
            <canvas id="playerCanvas" width="160" height="120"></canvas>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const canvas = document.getElementById('playerCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('audioPlayer');
        const statusDiv = document.getElementById('status');

        let frames = [];
        let width = 160;
        let height = 120;
        let isLoaded = false;
        let animationId = null;

        async function loadFiles() {
            const textFile = document.getElementById('textFile').files[0];
            const audioFile = document.getElementById('audioFile').files[0];

            if (!textFile || !audioFile) return;

            statusDiv.innerText = "データを読み込み中...";

            const textData = await textFile.text();
            frames = textData.split('\n').filter(line => line.length > 0);

            if (frames.length > 0) {
                const len = frames[0].length;
                // テキストの文字数から解像度を逆算
                if (len === 19200) { width = 160; height = 120; }
                else if (len === 76800) { width = 320; height = 240; }
                else if (len === 230400) { width = 640; height = 360; }
                else if (len === 921600) { width = 1280; height = 720; }
                else {
                    // その他の場合の仮当て
                    width = 160;
                    height = Math.round(len / 160);
                }
                canvas.width = width;
                canvas.height = height;
            }

            audio.src = URL.createObjectURL(audioFile);
            isLoaded = true;
            statusDiv.innerText = `準備完了！ (${width}x${height} / 全 ${frames.length} フレーム)`;
            drawFrame(0);
        }

        document.getElementById('textFile').addEventListener('change', loadFiles);
        document.getElementById('audioFile').addEventListener('change', loadFiles);

        function drawFrame(frameIndex) {
            if (!frames[frameIndex]) return;
            const line = frames[frameIndex];

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < line.length; i++) {
                const val = parseInt(line[i], 10);
                if (val === 0) continue;

                const x = i % width;
                const y = Math.floor(i / width);

                const colorVal = Math.floor((val / 9) * 230) + 25;
                ctx.fillStyle = `rgb(${colorVal}, ${colorVal}, ${colorVal})`;
                ctx.fillRect(x, y, 1, 1);
            }
        }

        function playRetro() {
            if (!isLoaded) {
                alert('先にテキストと音声ファイルを選択してください！');
                return;
            }

            stopPlayback();
            const fps = parseFloat(document.getElementById('fpsSelect').value);

            audio.currentTime = 0;
            audio.play();

            let lastFrameIndex = -1;

            function update() {
                if (audio.paused || audio.ended) {
                    stopPlayback();
                    return;
                }

                const currentTime = audio.currentTime;
                const currentFrame = Math.floor(currentTime * fps);

                if (currentFrame !== lastFrameIndex && currentFrame < frames.length) {
                    drawFrame(currentFrame);
                    lastFrameIndex = currentFrame;
                }

                if (currentFrame < frames.length) {
                    animationId = requestAnimationFrame(update);
                } else {
                    stopPlayback();
                }
            }

            animationId = requestAnimationFrame(update);
            statusDiv.innerText = "再生中...";
        }

        function stopPlayback() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (!audio.paused) {
                audio.pause();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                canvas.requestFullscreen().catch(err => alert(`エラー: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        async function exportToMP4() {
            if (!isLoaded) {
                alert('先にテキストと音声ファイルを選択してください！');
                return;
            }

            if (!window.MediaRecorder) {
                alert('お使いのブラウザは動画の書き出しに対応していません。');
                return;
            }

            stopPlayback();
            statusDiv.innerText = "MP4動画の書き出しを準備中...";

            const fps = parseFloat(document.getElementById('fpsSelect').value);
            const frameIntervalMs = 1000 / fps;

            const canvasStream = canvas.captureStream(fps);
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            const destination = audioCtx.createMediaStreamDestination();
            source.connect(destination);
            source.connect(audioCtx.destination);

            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...destination.stream.getAudioTracks()
            ]);

            let mimeType = 'video/mp4';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm;codecs=h264';
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
            }

            let recorder;
            try {
                recorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
            } catch (e) {
                recorder = new MediaRecorder(combinedStream);
            }

            const chunks = [];
            recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: recorder.mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const ext = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
                a.download = `retro_dot_${width}x${height}.${ext}`;
                a.click();
                statusDiv.innerText = `動画の書き出しが完了しました！`;
            };

            recorder.start();
            audio.currentTime = 0;
            audio.play();

            let currentIdx = 0;
            statusDiv.innerText = `動画書き出し中... (0 / ${frames.length} フレーム)`;

            const exportInterval = setInterval(() => {
                if (currentIdx >= frames.length || audio.ended) {
                    clearInterval(exportInterval);
                    audio.pause();
                    setTimeout(() => recorder.stop(), 500);
                    return;
                }

                drawFrame(currentIdx);
                statusDiv.innerText = `動画書き出し中... (${currentIdx + 1} / ${frames.length} フレーム)`;
                currentIdx++;
            }, frameIntervalMs);
        }
    </script>
</body>
</html>
