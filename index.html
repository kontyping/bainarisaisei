<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>魔改造・スピード可変プレイヤー</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background: #121212; color: #fff; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 400px; }
        input[type="file"], input[type="range"] { margin: 10px 0; width: 100%; }
        button { margin: 5px; padding: 10px 20px; font-size: 16px; background: #2ed573; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; }
        button:hover { background: #7bed9f; }
        .stop-btn { background: #ff4757 !important; }
        .stop-btn:hover { background: #ff6b81 !important; }
        #playerCanvas { background: black; border: 4px solid #333; margin-top: 20px; image-rendering: pixelated; width: 320px; height: 240px; }
        #status { margin-top: 10px; color: #ffa502; font-size: 14px; }
        .slider-container { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; }
        label { font-size: 14px; color: #ccc; }
    </style>
</head>
<body>
    <div class="box">
        <h1>魔改造プレイヤー</h1>
        <p>データファイルを選んで再生してね</p>
        
        <input type="file" id="dataFile" accept=".txt"><br>
        
        <div>
            <button onclick="startPlayback()">再生</button>
            <button class="stop-btn" onclick="stopPlayback()">停止</button>
        </div>

        <div class="slider-container">
            <label>再生スピード (FPS): <span id="fpsValue">10</span> fps</label>
            <input type="range" id="fpsSlider" min="0.5" max="30" step="0.5" value="10" oninput="updateFps(this.value)">
        </div>

        <div id="status">ファイル未選択</div>
        
        <!-- 画面表示用Canvas (内部解像度は160x120) -->
        <canvas id="playerCanvas" width="160" height="120"></canvas>
    </div>

    <script>
        let frames = [];
        let currentFrame = 0;
        let isPlaying = false;
        let lastTime = 0;
        let accumulator = 0;
        let currentFps = 10;

        const width = 160;
        const height = 120;
        const canvas = document.getElementById('playerCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const fpsValueSpan = document.getElementById('fpsValue');

        // ファイル読み込み
        document.getElementById('dataFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = "データを読み込んでいます...";
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                frames = text.split('\n').filter(line => line.length > 0);
                statusDiv.innerText = `読み込み完了！ (全 ${frames.length} フレーム)`;
                currentFrame = 0;
                drawFrame(0);
            };
            reader.readAsText(file);
        });

        // スライダーでFPSを変更した時
        function updateFps(val) {
            currentFps = parseFloat(val);
            fpsValueSpan.innerText = currentFps;
        }

        // 1フレームを描画する関数
        function drawFrame(index) {
            if (frames.length === 0 || index >= frames.length) return;

            const frameData = frames[index];
            const imgData = ctx.createImageData(width, height);

            for (let i = 0; i < frameData.length; i++) {
                const char = frameData[i];
                const level = parseInt(char, 10) || 0;
                const val = Math.floor((level / 9) * 255); 

                const p = i * 4;
                imgData.data[p]     = val; // R
                imgData.data[p + 1] = val; // G
                imgData.data[p + 2] = val; // B
                imgData.data[p + 3] = 255; // A
            }

            ctx.putImageData(imgData, 0, 0);
            statusDiv.innerText = `再生中: ${index + 1} / ${frames.length} フレーム (${currentFps}fps)`;
        }

        // デルタタイムを使った滑らかな高精度ループ（魔改造のキモ）
        function loop(timestamp) {
            if (!isPlaying) return;

            if (!lastTime) lastTime = timestamp;
            const deltaTime = (timestamp - lastTime) / 1000; // 経過秒数
            lastTime = timestamp;

            accumulator += deltaTime;
            const frameInterval = 1 / currentFps;

            // 経過時間に応じて進めるフレーム数を計算
            while (accumulator >= frameInterval) {
                accumulator -= frameInterval;
                currentFrame++;
                
                if (currentFrame >= frames.length) {
                    currentFrame = 0; // ループ
                }
                drawFrame(currentFrame);
            }

            requestAnimationFrame(loop);
        }

        function startPlayback() {
            if (frames.length === 0) {
                alert('先にテキストファイルを選んでください！');
                return;
            }
            if (isPlaying) return; // 二重防止

            isPlaying = true;
            lastTime = 0;
            accumulator = 0;
            requestAnimationFrame(loop);
        }

        function stopPlayback() {
            isPlaying = false;
            statusDiv.innerText = "停止中";
        }
    </script>
</body>
</html>
