<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レトロドット風・魔改造プレイヤー</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background: #0b0b0b; color: #fff; }
        .box { background: #161616; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 20px rgba(0,0,0,0.8); border: 1px solid #333; }
        input[type="file"], input[type="range"] { margin: 10px 0; width: 100%; }
        button { margin: 5px; padding: 10px 20px; font-size: 16px; background: #0984e3; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; }
        button:hover { background: #74b9ff; }
        .stop-btn { background: #d63031 !important; }
        .stop-btn:hover { background: #ff7675 !important; }
        
        /* 画面表示用Canvas (レトロな雰囲気を出すためにシャープに描画) */
        #playerCanvas { 
            background: #000; 
            border: 6px solid #222; 
            border-radius: 4px;
            margin-top: 20px; 
            width: 480px; 
            height: 360px; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #status { margin-top: 10px; color: #00cec9; font-size: 14px; font-family: monospace; }
        .slider-container { background: #222; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; }
        label { font-size: 14px; color: #bbb; }
    </style>
</head>
<body>
    <div class="box">
        <h1>RETRO DOT PLAYER</h1>
        <p>テキストデータを選んでレトロゲーム風に再生</p>
        
        <input type="file" id="dataFile" accept=".txt"><br>
        
        <div>
            <button onclick="startPlayback()">再生</button>
            <button class="stop-btn" onclick="stopPlayback()">停止</button>
        </div>

        <div class="slider-container">
            <label>再生スピード (FPS): <span id="fpsValue">10</span> fps</label>
            <input type="range" id="fpsSlider" min="0.5" max="30" step="0.5" value="10" oninput="updateFps(this.value)">
        </div>

        <div id="status">ファイル未選択</div>
        
        <!-- 描画用Canvas（内部解像度を160x120にして、CSSで拡大） -->
        <canvas id="playerCanvas" width="160" height="120"></canvas>
    </div>

    <script>
        let frames = [];
        let currentFrame = 0;
        let isPlaying = false;
        let lastTime = 0;
        let accumulator = 0;
        let currentFps = 10;

        const width = 160;
        const height = 120;
        const canvas = document.getElementById('playerCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const fpsValueSpan = document.getElementById('fpsValue');

        // ファイル読み込み
        document.getElementById('dataFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = "データを読み込んでいます...";
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                frames = text.split('\n').filter(line => line.length > 0);
                statusDiv.innerText = `読み込み完了！ (全 ${frames.length} フレーム)`;
                currentFrame = 0;
                drawFrame(0);
            };
            reader.readAsText(file);
        });

        // スライダーでFPSを変更
        function updateFps(val) {
            currentFps = parseFloat(val);
            fpsValueSpan.innerText = currentFps;
        }

        // 1フレームを「すきま空きドット」風に描画する関数
        function drawFrame(index) {
            if (frames.length === 0 || index >= frames.length) return;

            const frameData = frames[index];
            
            // 1. まず画面全体を完全に黒で塗りつぶす（これが隙間のベースになる）
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // 2. 1ドットずつ「少し小さめ」に四角を描画する
            for (let i = 0; i < frameData.length; i++) {
                const char = frameData[i];
                const level = parseInt(char, 10) || 0;
                
                // レベル0（完全に黒）は何もしない（隙間として黒を残す）
                if (level === 0) continue;

                const x = i % width;
                const y = Math.floor(i / width);

                // 濃淡（0〜9）を明度に変換（レベル1〜9を明るさに割り当て）
                const val = Math.floor((level / 9) * 230) + 25; // 最小でも少し明るく
                ctx.fillStyle = `rgb(${val}, ${val}, ${val})`;

                // 【ここがポイント！】 1x1 のサイズではなく、少し縮めたサイズ（例: 0.8x0.8）で描画する
                // これにより、ドットの周りにわずかな隙間が生まれ、レトロなグリッド感がでる
                ctx.fillRect(x + 0.1, y + 0.1, 0.8, 0.8);
            }

            statusDiv.innerText = `PLAYING: ${index + 1} / ${frames.length} [${currentFps}fps]`;
        }

        // デルタタイム制御のループ
        function loop(timestamp) {
            if (!isPlaying) return;

            if (!lastTime) lastTime = timestamp;
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            accumulator += deltaTime;
            const frameInterval = 1 / currentFps;

            while (accumulator >= frameInterval) {
                accumulator -= frameInterval;
                currentFrame++;
                
                if (currentFrame >= frames.length) {
                    currentFrame = 0;
                }
                drawFrame(currentFrame);
            }

            requestAnimationFrame(loop);
        }

        function startPlayback() {
            if (frames.length === 0) {
                alert('先にテキストファイルを選んでください！');
                return;
            }
            if (isPlaying) return;

            isPlaying = true;
            lastTime = 0;
            accumulator = 0;
            requestAnimationFrame(loop);
        }

        function stopPlayback() {
            isPlaying = false;
            statusDiv.innerText = "STOPPED";
        }
    </script>
</body>
</html>
